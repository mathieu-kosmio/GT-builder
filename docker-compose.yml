# =============================================================================
# GT-builder - docker-compose cible
# Stack souveraine assemblée : Postgres/pgvector, Valkey, app Next.js,
# Hocuspocus (co-edition), worker BullMQ, Gotenberg (PDF), Astro (site public),
# Caddy (reverse proxy + TLS automatique, routage par sous-domaine).
#
# Transcription et LLM sont des APIs souveraines externes (OVHcloud / Scaleway /
# Mistral) appelees par le worker : pas de GPU a heberger ici.
# Un service whisper local est fourni en option pour le dev (profil "local-ai").
# =============================================================================

x-restart: &restart
  restart: unless-stopped

services:

  # --------------------------------------------------------------------------
  # Base de donnees : Postgres + extension pgvector (recherche semantique RAG)
  # Isolation multi-tenant assuree par Row Level Security (voir spec section 6)
  # --------------------------------------------------------------------------
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Passes au script d'init pour creer le role applicatif soumis au RLS
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # extensions, role, schema, RLS, quotas, seed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  # --------------------------------------------------------------------------
  # Cache + file de jobs (transcription, generation CR, propositions IA)
  # Valkey = fork libre BSD de Redis (evite la licence SSPL)
  # --------------------------------------------------------------------------
  valkey:
    <<: *restart
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD}"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  # --------------------------------------------------------------------------
  # Application principale : Next.js (UI + API REST/RPC)
  # Porte la logique metier : cycle reunion -> CR -> propositions -> livrable
  # --------------------------------------------------------------------------
  app:
    <<: *restart
    build: ./app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      AUTH_SECRET: ${AUTH_SECRET}
      # Stockage objet souverain (Scaleway / OVH / Garage) - compatible S3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Abstraction LLM (LiteLLM ou endpoint direct OpenAI-compatible)
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      # Service de co-edition et de rendu PDF
      HOCUSPOCUS_URL: ws://hocuspocus:1234
      GOTENBERG_URL: http://gotenberg:3000
      PUBLIC_BASE_DOMAIN: ${PUBLIC_BASE_DOMAIN}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [backend, frontend]

  # --------------------------------------------------------------------------
  # Serveur de co-edition temps reel : Hocuspocus (Yjs CRDT, WebSocket)
  # Persiste les documents Yjs en base ; sert aussi le temps reel applicatif
  # --------------------------------------------------------------------------
  hocuspocus:
    <<: *restart
    build: ./hocuspocus
    environment:
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}          # valide les JWT emis par l'app
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, frontend]

  # --------------------------------------------------------------------------
  # Worker asynchrone (BullMQ) : transcription, generation CR, propositions IA
  # Appelle les APIs souveraines de transcription et de LLM
  # --------------------------------------------------------------------------
  worker:
    <<: *restart
    build: ./app
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Transcription : endpoint managé OVH/Scaleway, ou service whisper local (profil local-ai)
      TRANSCRIBE_BASE_URL: ${TRANSCRIBE_BASE_URL}
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    networks: [backend]

  # --------------------------------------------------------------------------
  # Generation de PDF chartes a partir du HTML rendu (couverture, sommaire...)
  # --------------------------------------------------------------------------
  gotenberg:
    <<: *restart
    image: gotenberg/gotenberg:8
    command:
      - "gotenberg"
      - "--api-timeout=120s"
    networks: [backend]

  # --------------------------------------------------------------------------
  # Site public : pages des livrables publies (Astro, SSR)
  # Multi-domaine : sert les tenants sur leur sous-domaine / domaine custom
  # --------------------------------------------------------------------------
  public-site:
    <<: *restart
    build: ./public-site
    environment:
      API_BASE_URL: http://app:3000
      PUBLIC_BASE_DOMAIN: ${PUBLIC_BASE_DOMAIN}
    depends_on:
      app: { condition: service_started }
    networks: [backend, frontend]

  # --------------------------------------------------------------------------
  # Reverse proxy + TLS automatique (Let's Encrypt) + routage par hote
  #   app.<domaine>      -> app
  #   *.<domaine>        -> public-site (pages publiques des tenants)
  #   collab.<domaine>   -> hocuspocus (WebSocket)
  # --------------------------------------------------------------------------
  caddy:
    <<: *restart
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app: { condition: service_started }
    networks: [frontend]

  # --------------------------------------------------------------------------
  # OPTION (profil "sso") : Keycloak pour l'auth OIDC/SAML des federations
  # qui disposent deja d'un annuaire. Non demarre par defaut.
  # --------------------------------------------------------------------------
  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["sso"]
    command: ["start", "--optimized"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${APP_DB_USER}
      KC_DB_PASSWORD: ${APP_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, frontend]

  # --------------------------------------------------------------------------
  # OPTION (profil "local-ai") : transcription Whisper locale pour le DEV
  # En production on utilise un endpoint souverain managé (OVH/Scaleway).
  # --------------------------------------------------------------------------
  whisper:
    <<: *restart
    image: onerahmet/openai-whisper-asr-webservice:latest
    profiles: ["local-ai"]
    environment:
      ASR_MODEL: medium
      ASR_ENGINE: faster_whisper
    volumes:
      - whispercache:/root/.cache
    networks: [backend]

volumes:
  pgdata:
  valkeydata:
  caddydata:
  caddyconfig:
  whispercache:

networks:
  backend:
  frontend:
